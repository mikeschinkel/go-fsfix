[[item]]
id = "P1"
kind = "deliverable"
statement = "release.yml's generated release notes leave out commits that change only files under .endless/, using the git log pathspec ':(exclude).endless' as go-dt's release.yml does"

[[item]]
id = "P2"
kind = "exclusion"
statement = "Does not switch go-fsfix to gomion's generated workflows; E-2472 replaces test.yml and release.yml with them once gomion repo setup works"

[[item]]
id = "P3"
kind = "deliverable"
statement = ".gitignore lists go.work and go.work.sum"
verify = "git check-ignore go.work go.work.sum"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Every go.mod in go-fsfix says go 1.27.0, and test.yml and release.yml set up Go 1.27 with no GOEXPERIMENT (the go-pkgs package baseline, which the hand-maintained workflows carry until E-2472 lands)"
