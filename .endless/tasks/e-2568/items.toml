# Plan items for E-2568: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2568 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "After Create, every RepoFixture is a real git repository whose HEAD is on the declared branch and has exactly one commit"
verify = "test/ module: go-gitutil's read side reports the branch and a one-entry log; GitPath() contains HEAD and objects"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The fixture's one commit contains every declared file in the RepoFixture, including files that an ignore rule would match"
verify = "test/ module: declare a .gitignore that matches a declared file; that file is tracked and the working tree is clean"

[[item]]
id = "P3"
kind = "deliverable"
statement = "After Create, the working tree of every RepoFixture is clean"
verify = "test/ module: go-gitutil status reports no changes"

[[item]]
id = "P4"
kind = "deliverable"
statement = "RepoFixtureArgs has Branch (dt.GitBranchName), Message, Author and Committer (dt.Mailbox), and CommitTime (time.Time); each zero value means its default"
detail = "Zero Committer means the Author in effect"

[[item]]
id = "P5"
kind = "deliverable"
statement = "go-fsfix exports DefaultBranch (\"main\"), DefaultCommitMessage (\"fsfix: initial commit\"), DefaultAuthorName (\"go-fsfix\"), DefaultAuthorEmail (\"fsfix@example.com\"), DefaultAuthor (a dt.Mailbox composed from those two) and DefaultCommitTime"
detail = "DefaultCommitTime is 2000-01-01T00:00:00Z"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A fixture commit's author and committer dates are CommitTime, or DefaultCommitTime when it is zero"
verify = "test/ module: the same declaration created twice gives the same commit hash"

[[item]]
id = "P7"
kind = "deliverable"
statement = "Fixture creation runs git with the machine's global and system git config ignored"
verify = "test/ module: with GIT_CONFIG_GLOBAL pointing at a file that sets commit.gpgsign=true and a failing core.hooksPath hook, Create still succeeds"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Each fixture repository's own config sets commit.gpgsign=false, an empty core.hooksPath and core.autocrlf=false"
verify = "test/ module: read the repo-local config through go-gitutil"

[[item]]
id = "P9"
kind = "deliverable"
statement = "go-fsfix never executes git itself; every git operation goes through go-gitutil"
verify = "No os/exec import in go-fsfix's root module"

[[item]]
id = "P10"
kind = "deliverable"
statement = "RepoFixture.Repo() returns the *gitutil.Repo for the fixture and fails the test when called before Create"

[[item]]
id = "P11"
kind = "deliverable"
statement = "A RepoFixture nested in another RepoFixture is committed first and recorded by the outer repository as an embedded repository, with no advice printed"
verify = "test/ module: the outer repo's tree has a gitlink entry for the inner path"

[[item]]
id = "P12"
kind = "deliverable"
statement = "RepoFixture.AddClone(t, name, *CloneFixtureArgs) returns a *CloneFixture, embedding *RepoFixture, that after Create is a clone of the origin placed beside it on disk"
detail = "CloneFixtureArgs has Branch (dt.GitBranchName, the branch to check out), Permissions and ModifiedTime"

[[item]]
id = "P13"
kind = "deliverable"
statement = "RepoFixture.AddWorktree(t, name, *WorktreeFixtureArgs) returns a *WorktreeFixture that, after Create, is a linked worktree of the origin placed beside it on disk"
detail = "WorktreeFixtureArgs.Branch is a dt.GitBranchName; empty means a branch named after the fixture"

[[item]]
id = "P14"
kind = "deliverable"
statement = "AddFiles(t, map[dt.RelFilepath]string) on RootFixture, DirFixture and RepoFixture declares one file per key, creating intermediate directories"

[[item]]
id = "P15"
kind = "deliverable"
statement = "Reconcile on RootFixture, DirFixture and RepoFixture makes every declared file on disk match its declaration: missing files are written, modified files revert, and files declared after Create are written"
verify = "test/ module: a file declared after Create and reconciled shows as untracked; a committed file changed in the declaration and reconciled shows as modified"

[[item]]
id = "P16"
kind = "deliverable"
statement = "Reconcile never runs git: it neither commits, stages, resets nor checks out"

[[item]]
id = "P17"
kind = "deliverable"
statement = "Reconcile with ReconcileArgs.RemoveUndeclared set deletes every undeclared file in the fixture tree and never touches any .git directory or .git file; without it Reconcile deletes nothing"

[[item]]
id = "P18"
kind = "deliverable"
statement = "Calling Create after Cleanup rebuilds the whole fixture tree in a new temporary directory, with every repository, clone and worktree freshly created"
verify = "test/ module: commit inside a fixture, Cleanup, Create; the repo again has exactly one commit and the same hash"

[[item]]
id = "P19"
kind = "deliverable"
statement = "A missing git binary or a failing git step during Create fails the test with t.Fatal; it never skips"

[[item]]
id = "P20"
kind = "deliverable"
statement = "README documents real repositories, the defaults, the config isolation, Create versus Reconcile versus recreating, and no longer says fixtures simulate a repository"

[[item]]
id = "P21"
kind = "deliverable"
statement = "go-fsfix's root go.mod requires go-dt, go-gitutil and go-binaries by published versions with no replace directive"

[[item]]
id = "P22"
kind = "exclusion"
statement = "Does not add GoModFixture"

[[item]]
id = "P23"
kind = "exclusion"
statement = "Does not add AddSubmodule or write .gitmodules"

[[item]]
id = "P24"
kind = "exclusion"
statement = "Does not integrate go-cfgstore"

[[item]]
id = "P25"
kind = "exclusion"
statement = "Does not restore git state in place (no reset or checkout); a clean git state comes from recreating the fixture"

[[item]]
id = "P26"
kind = "deliverable"
statement = "No Add* method or fixture constructor modifies the caller's *Args struct; defaults are filled into a copy"
verify = "test/ module: pass one args value with zero fields to two Add* calls; the struct still has zero fields afterwards"

[[item]]
id = "P27"
kind = "deliverable"
statement = "Every git process a fixture starts runs in go-gitutil's Strict mode, so no variable from the caller's environment (GIT_DIR, GIT_INDEX_FILE, GIT_AUTHOR_*) reaches it"
verify = "test/ module: with GIT_DIR and GIT_INDEX_FILE set to another repository in the test's environment, Create still produces the fixture's own one-commit repository and leaves the other repository untouched"

[[item]]
id = "P28"
kind = "deliverable"
statement = "go-fsfix finds the git binary it passes as RepoArgs.GitPath through go-binaries (E-2616), not by searching PATH itself"
verify = "No os/exec import in go-fsfix's root module; go.mod requires go-binaries"
